name: Bug report
description: Something didn't work the way Gatekeeper says it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please run `gatekeeper doctor` (or `gatekeeper doctor --json`) and
        paste its output below — it's designed to be safe to share, with no
        tokens, keys, prompts, or source code. Please redact anything
        project-specific from the rest of this report (file names, business
        logic, etc.) if it isn't relevant to the bug.

  - type: textarea
    id: doctor-output
    attributes:
      label: gatekeeper doctor output
      render: text
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest set of steps/commands that reproduce it.
      placeholder: |
        1. gatekeeper challenge --summary "x" --files a.ts
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
